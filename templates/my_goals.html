<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>我的目標 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============ 主題系統 - CSS 變數 ============ */
    :root, [data-theme="modern-light"] {
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --bg-main: #ffffff;
      --bg-gradient: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --card-bg: #f8fafc;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --border-color: #e2e8f0;
      --hover-bg: #f1f5f9;
      --card-radius: 16px;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px 0;
      transition: all 0.3s ease;
    }
    .container {
      max-width: 1200px;
    }
    .header-card {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 30px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .header-card h1 {
      color: var(--primary-color);
    }
    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    .btn-primary:hover {
      background-color: var(--primary-dark);
      border-color: var(--primary-dark);
    }
    .goal-card {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 25px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .goal-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.15);
    }
    .progress {
      height: 12px;
      border-radius: 10px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 8px;
    }
    .filter-btn {
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state i {
      font-size: 4rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<script>
  if (!document.cookie.includes('logged_in=true')) {
    window.location.replace('/');
  }
</script>

<div class="container">
  <!-- 標題區 -->
  <div class="header-card">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h1><i class="fas fa-bullseye me-2"></i>我的目標</h1>
        <p class="text-muted mb-0">管理您的學術目標與任務進度</p>
      </div>
      <div>
        <a href="/my-goals/dashboard" class="btn btn-info me-2">
          <i class="fas fa-chart-line me-1"></i>儀表板
        </a>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addGoalModal">
          <i class="fas fa-plus me-1"></i>新增目標
        </button>
        <a href="/" class="btn btn-outline-secondary ms-2">
          <i class="fas fa-arrow-left me-1"></i>返回
        </a>
      </div>
    </div>
  </div>

  <!-- 篩選器 -->
  <div class="mb-4">
    <button class="btn btn-sm btn-outline-primary filter-btn active" data-filter="all">
      <i class="fas fa-th me-1"></i>全部
    </button>
    <button class="btn btn-sm btn-outline-success filter-btn" data-filter="active">
      <i class="fas fa-play-circle me-1"></i>進行中
    </button>
    <button class="btn btn-sm btn-outline-info filter-btn" data-filter="completed">
      <i class="fas fa-check-circle me-1"></i>已完成
    </button>
    <button class="btn btn-sm btn-outline-secondary filter-btn" data-filter="archived">
      <i class="fas fa-archive me-1"></i>已封存
    </button>
  </div>

  <!-- 載入中 -->
  <div id="loadingSpinner" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">載入中...</span>
    </div>
    <p class="mt-3 text-muted">正在載入目標...</p>
  </div>

  <!-- 空狀態 -->
  <div id="emptyState" class="empty-state d-none">
    <i class="fas fa-bullseye"></i>
    <h4>還沒有任何目標</h4>
    <p class="text-muted">開始建立您的第一個學術目標吧！</p>
    <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#addGoalModal">
      <i class="fas fa-plus me-2"></i>新增目標
    </button>
  </div>

  <!-- 目標列表 -->
  <div id="goalsList" class="row"></div>
</div>

<!-- 新增/編輯目標 Modal -->
<div class="modal fade" id="addGoalModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="goalModalTitle">新增目標</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="goalForm">
          <input type="hidden" id="goalId">
          <div class="mb-3">
            <label for="goalTitle" class="form-label">目標標題 *</label>
            <input type="text" class="form-control" id="goalTitle" required maxlength="200">
          </div>
          <div class="mb-3">
            <label for="goalDescription" class="form-label">描述</label>
            <textarea class="form-control" id="goalDescription" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="goalTargetDate" class="form-label">目標日期</label>
            <input type="date" class="form-control" id="goalTargetDate">
          </div>
          <div class="mb-3">
            <label for="goalColor" class="form-label">顏色</label>
            <select class="form-select" id="goalColor">
              <option value="primary">藍色</option>
              <option value="success">綠色</option>
              <option value="warning">黃色</option>
              <option value="danger">紅色</option>
              <option value="info">青色</option>
              <option value="secondary">灰色</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="saveGoal()">儲存</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentFilter = 'all';
let allGoals = [];

// 載入目標列表
async function loadGoals() {
  try {
    const response = await fetch('/api/goals', {
      credentials: 'include'
    });

    if (response.status === 401) {
      window.location.replace('/login');
      return;
    }

    if (!response.ok) {
      throw new Error('載入目標失敗');
    }

    const data = await response.json();
    allGoals = data.goals || [];
    displayGoals();

  } catch (error) {
    console.error('Error:', error);
    document.getElementById('loadingSpinner').classList.add('d-none');
    alert('載入目標時發生錯誤：' + error.message);
  }
}

function displayGoals() {
  document.getElementById('loadingSpinner').classList.add('d-none');

  // 篩選目標
  const filteredGoals = currentFilter === 'all'
    ? allGoals
    : allGoals.filter(g => g.status === currentFilter);

  if (filteredGoals.length === 0) {
    document.getElementById('emptyState').classList.remove('d-none');
    document.getElementById('goalsList').innerHTML = '';
    return;
  }

  document.getElementById('emptyState').classList.add('d-none');
  const listContainer = document.getElementById('goalsList');

  listContainer.innerHTML = filteredGoals.map(goal => {
    const percentage = goal.completion_percentage || 0;
    const progressColor = percentage < 30 ? 'danger' : percentage < 70 ? 'warning' : 'success';
    const statusBadge = goal.status === 'completed' ? 'success' : goal.status === 'archived' ? 'secondary' : 'primary';
    const isOverdue = goal.is_overdue;

    return `
      <div class="col-md-6 col-lg-4">
        <div class="goal-card" onclick="viewGoal(${goal.id})">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="mb-0 flex-grow-1">
              <i class="fas fa-bullseye text-${goal.color || 'primary'} me-2"></i>
              ${escapeHtml(goal.title)}
            </h5>
            <span class="badge bg-${statusBadge} ms-2">
              ${goal.status === 'active' ? '進行中' : goal.status === 'completed' ? '已完成' : '已封存'}
            </span>
          </div>

          ${goal.description ? `
            <p class="text-muted small mb-3">${escapeHtml(goal.description).substring(0, 80)}${goal.description.length > 80 ? '...' : ''}</p>
          ` : ''}

          <div class="progress mb-3">
            <div class="progress-bar bg-${progressColor}" role="progressbar"
                 style="width: ${percentage}%" aria-valuenow="${percentage}"
                 aria-valuemin="0" aria-valuemax="100">
              ${percentage}%
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center text-muted small">
            <span>
              <i class="fas fa-tasks me-1"></i>
              ${goal.completed_tasks} / ${goal.total_tasks} 任務
            </span>
            ${goal.target_date ? `
              <span class="${isOverdue ? 'text-danger' : ''}">
                <i class="fas fa-calendar${isOverdue ? '-times' : ''} me-1"></i>
                ${new Date(goal.target_date).toLocaleDateString('zh-TW')}
              </span>
            ` : ''}
          </div>

          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary flex-grow-1" onclick="event.stopPropagation(); viewGoal(${goal.id})">
              <i class="fas fa-eye me-1"></i>查看
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); editGoal(${goal.id})">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); deleteGoal(${goal.id}, '${escapeHtml(goal.title)}')">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function viewGoal(goalId) {
  window.location.href = `/my-goals/${goalId}`;
}

async function editGoal(goalId) {
  const goal = allGoals.find(g => g.id === goalId);
  if (!goal) return;

  document.getElementById('goalModalTitle').textContent = '編輯目標';
  document.getElementById('goalId').value = goal.id;
  document.getElementById('goalTitle').value = goal.title;
  document.getElementById('goalDescription').value = goal.description || '';
  document.getElementById('goalTargetDate').value = goal.target_date || '';
  document.getElementById('goalColor').value = goal.color || 'primary';

  const modal = new bootstrap.Modal(document.getElementById('addGoalModal'));
  modal.show();
}

async function saveGoal() {
  const goalId = document.getElementById('goalId').value;
  const title = document.getElementById('goalTitle').value.trim();

  if (!title) {
    alert('請輸入目標標題');
    return;
  }

  const data = {
    title: title,
    description: document.getElementById('goalDescription').value.trim(),
    target_date: document.getElementById('goalTargetDate').value || null,
    color: document.getElementById('goalColor').value
  };

  try {
    const url = goalId ? `/api/goals/${goalId}` : '/api/goals';
    const method = goalId ? 'PUT' : 'POST';

    const response = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error('儲存失敗');
    }

    bootstrap.Modal.getInstance(document.getElementById('addGoalModal')).hide();
    document.getElementById('goalForm').reset();
    document.getElementById('goalId').value = '';
    document.getElementById('goalModalTitle').textContent = '新增目標';

    loadGoals();

  } catch (error) {
    alert('儲存目標時發生錯誤：' + error.message);
  }
}

async function deleteGoal(goalId, title) {
  if (!confirm(`確定要刪除目標「${title}」嗎？所有相關任務也會被刪除，此操作無法復原。`)) {
    return;
  }

  try {
    const response = await fetch(`/api/goals/${goalId}`, {
      method: 'DELETE',
      credentials: 'include'
    });

    if (!response.ok) {
      throw new Error('刪除失敗');
    }

    loadGoals();

  } catch (error) {
    alert('刪除目標時發生錯誤：' + error.message);
  }
}

// 篩選功能
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    displayGoals();
  });
});

// 開啟新增目標 Modal 時重置表單
document.getElementById('addGoalModal').addEventListener('show.bs.modal', function (event) {
  if (!event.relatedTarget || !event.relatedTarget.getAttribute('onclick')?.includes('editGoal')) {
    document.getElementById('goalForm').reset();
    document.getElementById('goalId').value = '';
    document.getElementById('goalModalTitle').textContent = '新增目標';
  }
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function loadThemePreference() {
  const savedTheme = localStorage.getItem('theme') || 'modern-light';
  document.documentElement.setAttribute('data-theme', savedTheme);
}

document.addEventListener('DOMContentLoaded', function() {
  loadThemePreference();
  loadGoals();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
