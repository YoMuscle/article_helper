<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>目標詳情 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    :root, [data-theme="modern-light"] {
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --bg-main: #ffffff;
      --bg-gradient: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --card-bg: #f8fafc;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --border-color: #e2e8f0;
      --hover-bg: #f1f5f9;
      --card-radius: 16px;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px 0;
    }
    .header-card, .info-card, .tasks-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .task-item {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .task-item:hover {
      box-shadow: var(--card-shadow);
    }
    .task-item.completed {
      opacity: 0.7;
    }
    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .subtask-item {
      background: var(--hover-bg);
      border-left: 3px solid var(--primary-color);
      padding: 10px 15px;
      margin: 8px 0 8px 30px;
      border-radius: 8px;
    }
    .priority-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .priority-high { background-color: #fee2e2; color: #991b1b; }
    .priority-medium { background-color: #fef3c7; color: #92400e; }
    .priority-low { background-color: #dbeafe; color: #1e40af; }
    .tag-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    .progress-circle {
      width: 150px;
      height: 150px;
      margin: 0 auto;
    }
    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<script>
  if (!document.cookie.includes('logged_in=true')) {
    window.location.replace('/');
  }
</script>

<div class="container">
  <!-- 標題區 -->
  <div class="header-card">
    <div class="d-flex justify-content-between align-items-center">
      <div class="flex-grow-1">
        <h1 id="goalTitle"><i class="fas fa-bullseye me-2"></i>載入中...</h1>
        <p class="text-muted mb-0" id="goalDescription"></p>
      </div>
      <div>
        <a href="/my-goals" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left me-1"></i>返回
        </a>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- 左側：目標資訊 -->
    <div class="col-md-4">
      <div class="info-card">
        <h5 class="mb-4"><i class="fas fa-info-circle me-2"></i>目標資訊</h5>

        <!-- 進度環形圖 -->
        <div class="progress-circle mb-4">
          <canvas id="progressChart"></canvas>
        </div>

        <div class="text-center mb-4">
          <h3 id="completionPercentage">0%</h3>
          <p class="text-muted">完成進度</p>
        </div>

        <!-- 統計資訊 -->
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <span class="text-muted">已完成任務</span>
            <strong id="completedTasks">0</strong>
          </div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <span class="text-muted">總任務數</span>
            <strong id="totalTasks">0</strong>
          </div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <span class="text-muted">目標日期</span>
            <strong id="targetDate">未設定</strong>
          </div>
        </div>
        <div class="mb-4">
          <div class="d-flex justify-content-between">
            <span class="text-muted">狀態</span>
            <span class="badge bg-primary" id="goalStatus">進行中</span>
          </div>
        </div>

        <!-- 操作按鈕 -->
        <div class="d-grid gap-2">
          <button class="btn btn-outline-primary" onclick="editGoal()">
            <i class="fas fa-edit me-1"></i>編輯目標
          </button>
          <button class="btn btn-outline-success" onclick="toggleGoalStatus('completed')">
            <i class="fas fa-check-circle me-1"></i>標記為完成
          </button>
          <button class="btn btn-outline-danger" onclick="deleteGoal()">
            <i class="fas fa-trash me-1"></i>刪除目標
          </button>
        </div>
      </div>
    </div>

    <!-- 右側：任務列表 -->
    <div class="col-md-8">
      <div class="tasks-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5><i class="fas fa-tasks me-2"></i>任務列表</h5>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            <i class="fas fa-plus me-1"></i>新增任務
          </button>
        </div>

        <!-- 載入中 -->
        <div id="tasksLoading" class="text-center py-4">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">載入任務中...</p>
        </div>

        <!-- 空狀態 -->
        <div id="tasksEmpty" class="text-center py-5 d-none">
          <i class="fas fa-clipboard-list fa-3x text-muted mb-3"></i>
          <h5>還沒有任務</h5>
          <p class="text-muted">為這個目標新增第一個任務吧！</p>
        </div>

        <!-- 任務列表 -->
        <div id="tasksList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/編輯任務 Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="taskModalTitle">新增任務</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <input type="hidden" id="taskId">
          <input type="hidden" id="parentTaskId">
          <div class="mb-3">
            <label for="taskTitle" class="form-label">任務標題 *</label>
            <input type="text" class="form-control" id="taskTitle" required maxlength="200">
          </div>
          <div class="mb-3">
            <label for="taskDescription" class="form-label">描述</label>
            <textarea class="form-control" id="taskDescription" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="taskDueDate" class="form-label">到期日期</label>
            <input type="date" class="form-control" id="taskDueDate">
          </div>
          <div class="mb-3">
            <label for="taskPriority" class="form-label">優先級</label>
            <select class="form-select" id="taskPriority">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="saveTask()">儲存</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
const goalId = {{ goal_id }};
let currentGoal = null;
let allTasks = [];
let progressChart = null;

// 載入目標詳情
async function loadGoal() {
  try {
    const response = await fetch(`/api/goals/${goalId}`, {
      credentials: 'include'
    });

    if (response.status === 401) {
      window.location.replace('/login');
      return;
    }

    if (response.status === 404) {
      alert('目標不存在');
      window.location.href = '/my-goals';
      return;
    }

    if (!response.ok) {
      throw new Error('載入失敗');
    }

    const data = await response.json();
    currentGoal = data.goal;
    displayGoal();

  } catch (error) {
    console.error('Error:', error);
    alert('載入目標時發生錯誤：' + error.message);
  }
}

// 載入任務列表
async function loadTasks() {
  try {
    const response = await fetch(`/api/goals/${goalId}/tasks`, {
      credentials: 'include'
    });

    if (!response.ok) {
      throw new Error('載入失敗');
    }

    const data = await response.json();
    allTasks = data.tasks || [];
    displayTasks();

  } catch (error) {
    console.error('Error:', error);
    document.getElementById('tasksLoading').classList.add('d-none');
    alert('載入任務時發生錯誤：' + error.message);
  }
}

function displayGoal() {
  if (!currentGoal) return;

  document.getElementById('goalTitle').innerHTML =
    `<i class="fas fa-bullseye text-${currentGoal.color || 'primary'} me-2"></i>${escapeHtml(currentGoal.title)}`;
  document.getElementById('goalDescription').textContent = currentGoal.description || '無描述';
  document.getElementById('completionPercentage').textContent = (currentGoal.completion_percentage || 0) + '%';
  document.getElementById('completedTasks').textContent = currentGoal.completed_tasks || 0;
  document.getElementById('totalTasks').textContent = currentGoal.total_tasks || 0;
  document.getElementById('targetDate').textContent = currentGoal.target_date
    ? new Date(currentGoal.target_date).toLocaleDateString('zh-TW')
    : '未設定';

  const statusMap = { active: '進行中', completed: '已完成', archived: '已封存' };
  const statusClass = { active: 'primary', completed: 'success', archived: 'secondary' };
  document.getElementById('goalStatus').textContent = statusMap[currentGoal.status] || '進行中';
  document.getElementById('goalStatus').className = `badge bg-${statusClass[currentGoal.status] || 'primary'}`;

  // 繪製進度環形圖
  drawProgressChart(currentGoal.completion_percentage || 0);
}

function displayTasks() {
  document.getElementById('tasksLoading').classList.add('d-none');

  // 過濾出主任務（沒有 parent_task_id 的任務）
  const mainTasks = allTasks.filter(t => !t.parent_task_id);

  if (mainTasks.length === 0) {
    document.getElementById('tasksEmpty').classList.remove('d-none');
    document.getElementById('tasksList').innerHTML = '';
    return;
  }

  document.getElementById('tasksEmpty').classList.add('d-none');
  const listContainer = document.getElementById('tasksList');

  listContainer.innerHTML = mainTasks.map(task => {
    const priorityClass = `priority-${task.priority}`;
    const priorityText = { high: '高', medium: '中', low: '低' };
    const isOverdue = task.is_overdue;
    const subtasks = allTasks.filter(t => t.parent_task_id === task.id);

    return `
      <div class="task-item ${task.is_completed ? 'completed' : ''}">
        <div class="d-flex align-items-start">
          <input type="checkbox" class="task-checkbox me-3"
                 ${task.is_completed ? 'checked' : ''}
                 onchange="toggleTaskCompletion(${task.id}, this.checked)">
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="task-title mb-2">${escapeHtml(task.title)}</h6>
              <div>
                <span class="priority-badge ${priorityClass}">${priorityText[task.priority]}</span>
                ${isOverdue ? '<span class="badge bg-danger ms-1">逾期</span>' : ''}
              </div>
            </div>

            ${task.description ? `<p class="text-muted small mb-2">${escapeHtml(task.description)}</p>` : ''}

            <div class="d-flex justify-content-between align-items-center">
              <div>
                ${task.due_date ? `
                  <small class="text-muted ${isOverdue ? 'text-danger' : ''}">
                    <i class="fas fa-calendar me-1"></i>
                    ${new Date(task.due_date).toLocaleDateString('zh-TW')}
                    ${task.days_until_due !== null ? `(${task.days_until_due > 0 ? '剩' + task.days_until_due : '逾期' + Math.abs(task.days_until_due)}天)` : ''}
                  </small>
                ` : ''}
              </div>
              <div>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="addSubtask(${task.id})">
                  <i class="fas fa-plus me-1"></i>子任務
                </button>
                <button class="btn btn-sm btn-outline-secondary me-1" onclick="editTask(${task.id})">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id}, '${escapeHtml(task.title)}')">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>

            <!-- 子任務列表 -->
            ${subtasks.length > 0 ? `
              <div class="mt-3">
                <small class="text-muted">
                  <i class="fas fa-tasks me-1"></i>
                  子任務 (${subtasks.filter(st => st.is_completed).length}/${subtasks.length})
                </small>
                ${subtasks.map(st => `
                  <div class="subtask-item ${st.is_completed ? 'completed' : ''}">
                    <div class="d-flex align-items-center">
                      <input type="checkbox" class="task-checkbox me-2"
                             ${st.is_completed ? 'checked' : ''}
                             onchange="toggleTaskCompletion(${st.id}, this.checked)">
                      <span class="task-title flex-grow-1">${escapeHtml(st.title)}</span>
                      <button class="btn btn-sm btn-outline-danger btn-sm" onclick="deleteTask(${st.id}, '${escapeHtml(st.title)}')">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function toggleTaskCompletion(taskId, isCompleted) {
  try {
    const response = await fetch(`/api/tasks/${taskId}/complete`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ is_completed: isCompleted })
    });

    if (!response.ok) {
      throw new Error('更新失敗');
    }

    // 重新載入目標和任務
    await Promise.all([loadGoal(), loadTasks()]);

  } catch (error) {
    alert('更新任務狀態時發生錯誤：' + error.message);
  }
}

async function saveTask() {
  const taskId = document.getElementById('taskId').value;
  const parentTaskId = document.getElementById('parentTaskId').value;
  const title = document.getElementById('taskTitle').value.trim();

  if (!title) {
    alert('請輸入任務標題');
    return;
  }

  const data = {
    title: title,
    description: document.getElementById('taskDescription').value.trim(),
    due_date: document.getElementById('taskDueDate').value || null,
    priority: document.getElementById('taskPriority').value
  };

  try {
    let url, method;

    if (taskId) {
      // 編輯現有任務
      url = `/api/tasks/${taskId}`;
      method = 'PUT';
    } else if (parentTaskId) {
      // 新增子任務
      url = `/api/tasks/${parentTaskId}/subtasks`;
      method = 'POST';
    } else {
      // 新增主任務
      url = `/api/goals/${goalId}/tasks`;
      method = 'POST';
    }

    const response = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error('儲存失敗');
    }

    bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value = '';
    document.getElementById('parentTaskId').value = '';

    await Promise.all([loadGoal(), loadTasks()]);

  } catch (error) {
    alert('儲存任務時發生錯誤：' + error.message);
  }
}

function addSubtask(parentTaskId) {
  document.getElementById('taskModalTitle').textContent = '新增子任務';
  document.getElementById('taskForm').reset();
  document.getElementById('taskId').value = '';
  document.getElementById('parentTaskId').value = parentTaskId;

  const modal = new bootstrap.Modal(document.getElementById('addTaskModal'));
  modal.show();
}

async function editTask(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;

  document.getElementById('taskModalTitle').textContent = '編輯任務';
  document.getElementById('taskId').value = task.id;
  document.getElementById('parentTaskId').value = '';
  document.getElementById('taskTitle').value = task.title;
  document.getElementById('taskDescription').value = task.description || '';
  document.getElementById('taskDueDate').value = task.due_date || '';
  document.getElementById('taskPriority').value = task.priority;

  const modal = new bootstrap.Modal(document.getElementById('addTaskModal'));
  modal.show();
}

async function deleteTask(taskId, title) {
  if (!confirm(`確定要刪除任務「${title}」嗎？`)) {
    return;
  }

  try {
    const response = await fetch(`/api/tasks/${taskId}`, {
      method: 'DELETE',
      credentials: 'include'
    });

    if (!response.ok) {
      throw new Error('刪除失敗');
    }

    await Promise.all([loadGoal(), loadTasks()]);

  } catch (error) {
    alert('刪除任務時發生錯誤：' + error.message);
  }
}

async function deleteGoal() {
  if (!confirm(`確定要刪除目標「${currentGoal.title}」嗎？所有相關任務也會被刪除，此操作無法復原。`)) {
    return;
  }

  try {
    const response = await fetch(`/api/goals/${goalId}`, {
      method: 'DELETE',
      credentials: 'include'
    });

    if (!response.ok) {
      throw new Error('刪除失敗');
    }

    window.location.href = '/my-goals';

  } catch (error) {
    alert('刪除目標時發生錯誤：' + error.message);
  }
}

function drawProgressChart(percentage) {
  const ctx = document.getElementById('progressChart').getContext('2d');

  if (progressChart) {
    progressChart.destroy();
  }

  progressChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [percentage, 100 - percentage],
        backgroundColor: [
          percentage < 30 ? '#ef4444' : percentage < 70 ? '#f59e0b' : '#10b981',
          '#e5e7eb'
        ],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      cutout: '70%',
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      }
    }
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function loadThemePreference() {
  const savedTheme = localStorage.getItem('theme') || 'modern-light';
  document.documentElement.setAttribute('data-theme', savedTheme);
}

// 開啟新增任務 Modal 時重置表單
document.getElementById('addTaskModal').addEventListener('show.bs.modal', function (event) {
  if (!event.relatedTarget) {
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value = '';
    document.getElementById('parentTaskId').value = '';
    document.getElementById('taskModalTitle').textContent = '新增任務';
  }
});

document.addEventListener('DOMContentLoaded', function() {
  loadThemePreference();
  loadGoal();
  loadTasks();
});
</script>
</body>
</html>
