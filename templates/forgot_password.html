<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘記密碼 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============ 主題系統 ============ */
    :root, [data-theme="modern-light"] {
      --primary-color: #5a67d8;
      --bg-gradient: #f5f5f5;
      --text-primary: #1a1a1a;
      --text-muted: #9a9a9a;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-color: #e8e8e8;
      --input-bg: #ffffff;
      --input-border: #d0d0d0;
      --input-text: #1a1a1a;
    }
    [data-theme="modern-dark"] {
      --primary-color: #748ffc;
      --bg-gradient: #1f2125;
      --text-primary: #e9ecef;
      --text-muted: #6c757d;
      --card-bg: #25272c;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --border-color: #3a3d44;
      --input-bg: #2f3238;
      --input-border: #4a5568;
      --input-text: #f7f8f9;
    }
    [data-theme="vibrant"] {
      --primary-color: #7c3aed;
      --bg-gradient: #f5f0fa;
      --text-primary: #1f1f33;
      --text-muted: #7c7c99;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
      --border-color: #e0d6f0;
      --input-bg: #ffffff;
      --input-border: #c4b5e8;
      --input-text: #1f1f33;
    }
    [data-theme="academic"] {
      --primary-color: #1d4ed8;
      --bg-gradient: #f8f6f0;
      --text-primary: #292524;
      --text-muted: #78716c;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-color: #e8e0d0;
      --input-bg: #ffffff;
      --input-border: #d0c8b8;
      --input-text: #292524;
    }
    [data-theme="nature"] {
      --primary-color: #059669;
      --bg-gradient: #f0f8f2;
      --text-primary: #1a3a28;
      --text-muted: #6b8c78;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(5, 150, 105, 0.12);
      --border-color: #c8e0d0;
      --input-bg: #ffffff;
      --input-border: #a8d4b8;
      --input-text: #1a3a28;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .forgot-container {
      max-width: 450px;
      width: 100%;
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 40px;
      border-radius: 15px;
      box-shadow: var(--card-shadow);
    }
    .forgot-container h2 i {
      color: var(--primary-color);
    }
    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
    }
    .form-control:focus {
      background: var(--input-bg);
      border-color: var(--primary-color);
      color: var(--input-text);
      box-shadow: 0 0 0 3px rgba(90, 103, 216, 0.15);
    }
    .form-label {
      color: var(--text-primary);
    }
    .btn-primary {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    .text-muted {
      color: var(--text-muted) !important;
    }
    a {
      color: var(--primary-color);
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <h2 class="text-center mb-4">
      <i class="fas fa-lock text-primary"></i> 忘記密碼
    </h2>
    
    <p class="text-muted text-center mb-4">
      請輸入您註冊時使用的 Email，我們將發送密碼重設連結到您的信箱。
    </p>
    
    <!-- 錯誤訊息 -->
    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>
    
    <!-- 表單 -->
    <form id="forgotPasswordForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      
      <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
        <span class="spinner-border spinner-border-sm d-none me-2" id="submitSpinner"></span>
        發送重設連結
      </button>
    </form>
    
    <hr class="my-4">
    
    <div class="text-center">
      <a href="/login" class="text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i>返回登入頁面
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 載入主題偏好
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'modern-light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();

    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('submitSpinner');
      
      submitBtn.disabled = true;
      spinner.classList.remove('d-none');
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showSuccess(data.message);
          document.getElementById('forgotPasswordForm').reset();
        } else {
          showError(data.error || '發送失敗');
        }
      } catch (error) {
        showError('系統錯誤，請稍後再試');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
    
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.remove('d-none');
    }
    
    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.classList.remove('d-none');
    }
    
    function hideMessages() {
      document.getElementById('errorMessage').classList.add('d-none');
      document.getElementById('successMessage').classList.add('d-none');
    }
  </script>
</body>
</html>
