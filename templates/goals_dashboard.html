<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>統計儀表板 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="modern-light"] {
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --bg-main: #ffffff;
      --bg-gradient: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --card-bg: #f8fafc;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --border-color: #e2e8f0;
      --hover-bg: #f1f5f9;
      --card-radius: 16px;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px 0;
    }
    .header-card, .stat-card, .chart-card, .list-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .stat-card {
      text-align: center;
      padding: 25px;
    }
    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-color);
    }
    .stat-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .chart-container {
      position: relative;
      height: 300px;
    }
    .task-item-mini {
      padding: 12px;
      border-left: 3px solid var(--primary-color);
      background: white;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .task-item-mini.overdue {
      border-left-color: #ef4444;
    }
    .activity-item {
      padding: 12px;
      border-left: 3px solid var(--border-color);
      margin-bottom: 10px;
    }
    .activity-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }
  </style>
</head>
<body>
<script>
  if (!document.cookie.includes('logged_in=true')) {
    window.location.replace('/');
  }
</script>

<div class="container-fluid" style="max-width: 1400px;">
  <!-- 標題區 -->
  <div class="header-card">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h1><i class="fas fa-chart-line me-2"></i>統計儀表板</h1>
        <p class="text-muted mb-0">追蹤您的目標與任務進度</p>
      </div>
      <div>
        <a href="/my-goals" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left me-1"></i>返回目標列表
        </a>
      </div>
    </div>
  </div>

  <!-- 載入中 -->
  <div id="loadingSpinner" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3 text-muted">載入統計資料中...</p>
  </div>

  <!-- 統計卡片 -->
  <div id="statsSection" class="d-none">
    <div class="row mb-4">
      <div class="col-md-3 mb-3">
        <div class="stat-card">
          <div class="stat-number" id="totalGoals">0</div>
          <div class="stat-label">總目標數</div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="stat-card">
          <div class="stat-number" id="activeGoals">0</div>
          <div class="stat-label">進行中目標</div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="stat-card">
          <div class="stat-number" id="totalTasks">0</div>
          <div class="stat-label">總任務數</div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="stat-card">
          <div class="stat-number" id="completionRate">0%</div>
          <div class="stat-label">整體完成率</div>
        </div>
      </div>
    </div>

    <!-- 圖表區 -->
    <div class="row mb-4">
      <div class="col-md-8 mb-3">
        <div class="chart-card">
          <h5 class="mb-4"><i class="fas fa-chart-line me-2"></i>完成率趨勢（過去30天）</h5>
          <div class="chart-container">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="chart-card">
          <h5 class="mb-4"><i class="fas fa-chart-pie me-2"></i>目標分布</h5>
          <div class="chart-container">
            <canvas id="distributionChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 任務列表區 -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <div class="list-card">
          <h5 class="mb-4">
            <i class="fas fa-calendar-day me-2"></i>即將到期任務
            <span class="badge bg-warning ms-2" id="upcomingCount">0</span>
          </h5>
          <div id="upcomingTasks"></div>
          <div id="upcomingEmpty" class="text-center text-muted py-3 d-none">
            <i class="fas fa-check-circle fa-2x mb-2"></i>
            <p>沒有即將到期的任務</p>
          </div>
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <div class="list-card">
          <h5 class="mb-4">
            <i class="fas fa-exclamation-triangle me-2"></i>逾期任務
            <span class="badge bg-danger ms-2" id="overdueCount">0</span>
          </h5>
          <div id="overdueTasks"></div>
          <div id="overdueEmpty" class="text-center text-muted py-3 d-none">
            <i class="fas fa-smile fa-2x mb-2"></i>
            <p>太好了！沒有逾期任務</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let dashboardData = null;
let trendChart = null;
let distributionChart = null;

// 載入儀表板數據
async function loadDashboard() {
  try {
    const response = await fetch('/api/goals/dashboard', {
      credentials: 'include'
    });

    if (response.status === 401) {
      window.location.replace('/login');
      return;
    }

    if (!response.ok) {
      throw new Error('載入失敗');
    }

    const data = await response.json();
    dashboardData = data;
    displayDashboard();

  } catch (error) {
    console.error('Error:', error);
    document.getElementById('loadingSpinner').innerHTML = `
      <div class="alert alert-danger">
        載入儀表板時發生錯誤：${error.message}
      </div>
    `;
  }
}

function displayDashboard() {
  if (!dashboardData || !dashboardData.summary) return;

  document.getElementById('loadingSpinner').classList.add('d-none');
  document.getElementById('statsSection').classList.remove('d-none');

  const summary = dashboardData.summary;

  // 更新統計卡片
  document.getElementById('totalGoals').textContent = summary.total_goals || 0;
  document.getElementById('activeGoals').textContent = summary.active_goals || 0;
  document.getElementById('totalTasks').textContent = summary.total_tasks || 0;
  document.getElementById('completionRate').textContent =
    (summary.overall_completion_rate || 0).toFixed(1) + '%';

  // 繪製圖表
  drawTrendChart(dashboardData.productivity_trend || []);
  drawDistributionChart(summary);

  // 顯示即將到期任務
  displayUpcomingTasks(dashboardData.upcoming_tasks || []);

  // 顯示逾期任務
  displayOverdueTasks(dashboardData.overdue_tasks || []);
}

function drawTrendChart(trendData) {
  const ctx = document.getElementById('trendChart').getContext('2d');

  if (trendChart) {
    trendChart.destroy();
  }

  const labels = trendData.map(d => new Date(d.date).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' }));
  const data = trendData.map(d => d.completion_rate);

  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '完成率 (%)',
        data: data,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59, 130, 246, 0.1)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return '完成率: ' + context.parsed.y.toFixed(1) + '%';
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 100,
          ticks: {
            callback: function(value) {
              return value + '%';
            }
          }
        }
      }
    }
  });
}

function drawDistributionChart(summary) {
  const ctx = document.getElementById('distributionChart').getContext('2d');

  if (distributionChart) {
    distributionChart.destroy();
  }

  distributionChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['進行中', '已完成', '已封存'],
      datasets: [{
        data: [
          summary.active_goals || 0,
          summary.completed_goals || 0,
          (summary.total_goals || 0) - (summary.active_goals || 0) - (summary.completed_goals || 0)
        ],
        backgroundColor: [
          '#3b82f6',
          '#10b981',
          '#6b7280'
        ]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });
}

function displayUpcomingTasks(tasks) {
  const container = document.getElementById('upcomingTasks');
  const emptyState = document.getElementById('upcomingEmpty');
  const countBadge = document.getElementById('upcomingCount');

  countBadge.textContent = tasks.length;

  if (tasks.length === 0) {
    container.innerHTML = '';
    emptyState.classList.remove('d-none');
    return;
  }

  emptyState.classList.add('d-none');

  container.innerHTML = tasks.slice(0, 5).map(task => `
    <div class="task-item-mini">
      <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
          <h6 class="mb-1">${escapeHtml(task.title)}</h6>
          <small class="text-muted">
            <i class="fas fa-bullseye me-1"></i>${escapeHtml(task.goal_title)}
          </small>
        </div>
        <div class="text-end">
          <small class="text-warning">
            <i class="fas fa-calendar me-1"></i>
            ${task.days_until_due > 0 ? `剩${task.days_until_due}天` : '今天到期'}
          </small>
        </div>
      </div>
    </div>
  `).join('');

  if (tasks.length > 5) {
    container.innerHTML += `
      <div class="text-center mt-3">
        <small class="text-muted">還有 ${tasks.length - 5} 個任務...</small>
      </div>
    `;
  }
}

function displayOverdueTasks(tasks) {
  const container = document.getElementById('overdueTasks');
  const emptyState = document.getElementById('overdueEmpty');
  const countBadge = document.getElementById('overdueCount');

  countBadge.textContent = tasks.length;

  if (tasks.length === 0) {
    container.innerHTML = '';
    emptyState.classList.remove('d-none');
    return;
  }

  emptyState.classList.add('d-none');

  container.innerHTML = tasks.slice(0, 5).map(task => `
    <div class="task-item-mini overdue">
      <div class="d-flex justify-content-between align-items-start">
        <div class="flex-grow-1">
          <h6 class="mb-1">${escapeHtml(task.title)}</h6>
          <small class="text-muted">
            <i class="fas fa-bullseye me-1"></i>${escapeHtml(task.goal_title)}
          </small>
        </div>
        <div class="text-end">
          <small class="text-danger">
            <i class="fas fa-exclamation-triangle me-1"></i>
            逾期 ${Math.abs(task.days_until_due)} 天
          </small>
        </div>
      </div>
    </div>
  `).join('');

  if (tasks.length > 5) {
    container.innerHTML += `
      <div class="text-center mt-3">
        <small class="text-muted">還有 ${tasks.length - 5} 個逾期任務...</small>
      </div>
    `;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function loadThemePreference() {
  const savedTheme = localStorage.getItem('theme') || 'modern-light';
  document.documentElement.setAttribute('data-theme', savedTheme);
}

document.addEventListener('DOMContentLoaded', function() {
  loadThemePreference();
  loadDashboard();
});
</script>
</body>
</html>
