<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email 驗證 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-container {
      max-width: 500px;
      width: 100%;
      background: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .icon-success {
      color: #28a745;
      font-size: 80px;
      margin-bottom: 20px;
    }
    .icon-error {
      color: #dc3545;
      font-size: 80px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="result-container">
    {% if success %}
      <i class="fas fa-check-circle icon-success"></i>
      <h2 class="text-success mb-3">驗證成功！</h2>
      <p class="text-muted mb-4">{{ message }}</p>
      <a href="/login" class="btn btn-primary btn-lg">前往登入</a>
    {% else %}
      <i class="fas fa-times-circle icon-error"></i>
      <h2 class="text-danger mb-3">驗證失敗</h2>
      <p class="text-muted mb-4">{{ message }}</p>
      <a href="/" class="btn btn-secondary btn-lg">返回首頁</a>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
