<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>註冊 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============ 主題系統 ============ */
    :root, [data-theme="modern-light"] {
      --primary-color: #5a67d8;
      --bg-gradient: #f5f5f5;
      --text-primary: #1a1a1a;
      --text-muted: #9a9a9a;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-color: #e8e8e8;
      --input-bg: #ffffff;
      --input-border: #d0d0d0;
      --input-text: #1a1a1a;
    }
    [data-theme="modern-dark"] {
      --primary-color: #748ffc;
      --bg-gradient: #1f2125;
      --text-primary: #e9ecef;
      --text-muted: #6c757d;
      --card-bg: #25272c;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --border-color: #3a3d44;
      --input-bg: #2f3238;
      --input-border: #4a5568;
      --input-text: #f7f8f9;
    }
    [data-theme="vibrant"] {
      --primary-color: #7c3aed;
      --bg-gradient: #f5f0fa;
      --text-primary: #1f1f33;
      --text-muted: #7c7c99;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
      --border-color: #e0d6f0;
      --input-bg: #ffffff;
      --input-border: #c4b5e8;
      --input-text: #1f1f33;
    }
    [data-theme="academic"] {
      --primary-color: #1d4ed8;
      --bg-gradient: #f8f6f0;
      --text-primary: #292524;
      --text-muted: #78716c;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-color: #e8e0d0;
      --input-bg: #ffffff;
      --input-border: #d0c8b8;
      --input-text: #292524;
    }
    [data-theme="nature"] {
      --primary-color: #059669;
      --bg-gradient: #f0f8f2;
      --text-primary: #1a3a28;
      --text-muted: #6b8c78;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(5, 150, 105, 0.12);
      --border-color: #c8e0d0;
      --input-bg: #ffffff;
      --input-border: #a8d4b8;
      --input-text: #1a3a28;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .register-container {
      max-width: 450px;
      width: 100%;
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 40px;
      border-radius: 15px;
      box-shadow: var(--card-shadow);
    }
    .register-container h2 i {
      color: var(--primary-color);
    }
    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
    }
    .form-control:focus {
      background: var(--input-bg);
      border-color: var(--primary-color);
      color: var(--input-text);
      box-shadow: 0 0 0 3px rgba(90, 103, 216, 0.15);
    }
    .form-label {
      color: var(--text-primary);
    }
    .btn-primary {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    .btn-google {
      background-color: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-google:hover {
      background-color: var(--bg-gradient);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider span {
      padding: 0 10px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .text-muted {
      color: var(--text-muted) !important;
    }
    a {
      color: var(--primary-color);
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2 class="text-center mb-4">
      <i class="fas fa-user-plus text-primary"></i> 註冊論文救火站
    </h2>
    
    <!-- 錯誤訊息 -->
    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>
    
    <!-- 註冊表單 -->
    <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">使用者名稱</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      
      <div class="mb-3">
        <label for="password" class="form-label">密碼（至少 8 個字元）</label>
        <input type="password" class="form-control" id="password" required minlength="8">
      </div>
      
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">確認密碼</label>
        <input type="password" class="form-control" id="confirmPassword" required minlength="8">
      </div>
      
      <button type="submit" class="btn btn-primary btn-lg w-100" id="registerBtn">
        <span class="spinner-border spinner-border-sm d-none me-2" id="registerSpinner"></span>
        註冊
      </button>
    </form>
    
    <hr class="my-4">
    
    <div class="text-center">
      <p class="mb-0">已經有帳號了？ <a href="/login" class="text-decoration-none fw-bold">立即登入</a></p>
    </div>
    
    <div class="text-center mt-3">
      <a href="/" class="text-decoration-none text-muted">
        <i class="fas fa-arrow-left me-1"></i>返回首頁
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 載入主題偏好
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'modern-light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();

    // 處理註冊表單
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const registerBtn = document.getElementById('registerBtn');
      const spinner = document.getElementById('registerSpinner');
      
      // 驗證密碼
      if (password !== confirmPassword) {
        showError('兩次輸入的密碼不一致');
        return;
      }
      
      // 顯示載入狀態
      registerBtn.disabled = true;
      spinner.classList.remove('d-none');
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, email, password }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showSuccess(data.message + ' 請前往登入頁面。');
          // 清空表單
          document.getElementById('registerForm').reset();
          // 3 秒後跳轉到登入頁面
          setTimeout(() => {
            // 使用 replace 防止用戶用返回鍵回到註冊頁
            window.location.replace('/login');
          }, 3000);
        } else {
          showError(data.error || '註冊失敗');
        }
      } catch (error) {
        showError('系統錯誤，請稍後再試');
      } finally {
        registerBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
    
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.remove('d-none');
    }
    
    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.classList.remove('d-none');
    }
    
    function hideMessages() {
      document.getElementById('errorMessage').classList.add('d-none');
      document.getElementById('successMessage').classList.add('d-none');
    }
  </script>
</body>
</html>
