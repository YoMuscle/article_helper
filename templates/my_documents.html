<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 防止瀏覽器快取此頁面 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>我的文件 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============ 主題系統 - CSS 變數 ============ */
    :root, [data-theme="modern-light"] {
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --bg-main: #ffffff;
      --bg-gradient: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --card-bg: #f8fafc;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --border-color: #e2e8f0;
      --hover-bg: #f1f5f9;
      --card-radius: 16px;
    }
    
    [data-theme="cyber-night"] {
      --primary-color: #06ffa5;
      --primary-dark: #00cc84;
      --bg-main: #0a0a0f;
      --bg-gradient: #0a0a0f;
      --text-primary: #e0ffe0;
      --text-secondary: #a0ffa0;
      --text-muted: #4a9a4a;
      --card-bg: rgba(10, 20, 15, 0.9);
      --card-shadow: 0 0 30px rgba(6, 255, 165, 0.15);
      --border-color: #06ffa530;
      --hover-bg: rgba(6, 255, 165, 0.1);
      --card-radius: 4px;
    }
    
    [data-theme="google-colors"] {
      --primary-color: #4285F4;
      --primary-dark: #3367D6;
      --bg-main: #ffffff;
      --bg-gradient: #ffffff;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-muted: #9aa0a6;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px rgba(60, 64, 67, 0.15), 0 4px 8px rgba(60, 64, 67, 0.1);
      --border-color: #e8eaed;
      --hover-bg: #f8f9fa;
      --card-radius: 16px;
    }
    
    [data-theme="aurora"] {
      --primary-color: #22d3ee;
      --primary-dark: #06b6d4;
      --bg-main: #0f172a;
      --bg-gradient: #0f172a;
      --text-primary: #f0fdfa;
      --text-secondary: #99f6e4;
      --text-muted: #5eead4;
      --card-bg: rgba(15, 23, 42, 0.8);
      --card-shadow: 0 10px 40px rgba(34, 211, 238, 0.1);
      --border-color: rgba(34, 211, 238, 0.2);
      --hover-bg: rgba(34, 211, 238, 0.1);
      --card-radius: 20px;
    }
    
    [data-theme="minimal-ink"] {
      --primary-color: #374151;
      --primary-dark: #1f2937;
      --bg-main: #fefefe;
      --bg-gradient: #fefefe;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #9ca3af;
      --card-bg: #ffffff;
      --card-shadow: 4px 4px 0 #111827;
      --border-color: #111827;
      --hover-bg: #f9fafb;
      --card-radius: 0px;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px 0;
      transition: all 0.3s ease;
    }
    .container {
      max-width: 1200px;
    }
    .header-card {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 30px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .header-card h1 {
      color: var(--primary-color);
    }
    .header-card .text-muted {
      color: var(--text-muted) !important;
    }
    .document-card {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 30px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
    }
    .document-card h3 {
      color: var(--text-primary);
    }
    .document-item {
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 20px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
      background: var(--hover-bg);
    }
    .document-item:hover {
      box-shadow: var(--card-shadow);
      transform: translateY(-2px);
    }
    .document-item h5 {
      color: var(--text-primary);
    }
    .document-item .text-muted {
      color: var(--text-muted) !important;
    }
    .btn-back {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--card-radius);
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      background-color: var(--primary-dark);
      color: white;
      transform: translateY(-2px);
      box-shadow: var(--card-shadow);
    }
    .stats-card {
      text-align: center;
      padding: 15px;
      border-radius: var(--card-radius);
      background: var(--primary-color);
      color: white;
    }
    .stats-number {
      font-size: 2rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
<script>
  // 立即檢查登入 cookie，未登入則重新導向
  if (!document.cookie.includes('logged_in=true')) {
    window.location.replace('/');
  }
</script>

<div class="container">
  <!-- 標題區 -->
  <div class="header-card">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h1><i class="fas fa-folder-open me-2"></i>我的文件</h1>
        <p class="text-muted mb-0">查看您所有上傳過的文件與分析結果</p>
      </div>
      <div>
        <a href="/" class="btn-back">
          <i class="fas fa-arrow-left me-1"></i>返回首頁
        </a>
      </div>
    </div>
  </div>

  <!-- 統計資訊 -->
  <div class="row mb-4" id="statsSection" style="display: none;">
    <div class="col-md-4 mb-3">
      <div class="stats-card">
        <div class="stats-number" id="totalDocuments">0</div>
        <div class="small">總文件數</div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="stats-card">
        <div class="stats-number" id="totalErrors">0</div>
        <div class="small">總錯誤數</div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="stats-card">
        <div class="stats-number" id="avgScore">-</div>
        <div class="small">平均分數</div>
      </div>
    </div>
  </div>

  <!-- 文件列表 -->
  <div class="document-card">
    <h3 class="mb-4"><i class="fas fa-list me-2"></i>文件列表</h3>
    
    <!-- 載入中 -->
    <div id="loadingSpinner" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
      <p class="mt-3 text-muted">正在載入文件...</p>
    </div>

    <!-- 錯誤訊息 -->
    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

    <!-- 空狀態 -->
    <div id="emptyState" class="text-center py-5 d-none">
      <i class="fas fa-inbox fa-4x text-muted mb-3"></i>
      <h4>還沒有上傳任何文件</h4>
      <p class="text-muted">返回首頁開始上傳您的第一個文件吧！</p>
      <a href="/" class="btn btn-primary mt-3">
        <i class="fas fa-upload me-2"></i>上傳文件
      </a>
    </div>

    <!-- 文件列表 -->
    <div id="documentsList"></div>
  </div>
</div>

<script>
  // 載入文件列表
  async function loadDocuments() {
    try {
      const response = await fetch('/api/documents', {
        credentials: 'include'
      });

      if (response.status === 401) {
        // 使用 replace 防止用戶用返回鍵回來
        window.location.replace('/login');
        return;
      }

      if (!response.ok) {
        throw new Error('載入文件失敗');
      }

      const data = await response.json();
      displayDocuments(data.documents);

    } catch (error) {
      console.error('Error:', error);
      document.getElementById('loadingSpinner').classList.add('d-none');
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = '載入文件時發生錯誤：' + error.message;
      errorDiv.classList.remove('d-none');
    }
  }

  function displayDocuments(documents) {
    document.getElementById('loadingSpinner').classList.add('d-none');

    if (!documents || documents.length === 0) {
      document.getElementById('emptyState').classList.remove('d-none');
      return;
    }

    // 顯示統計資訊
    displayStats(documents);

    // 顯示文件列表
    const listContainer = document.getElementById('documentsList');
    listContainer.innerHTML = documents.map(doc => {
      const result = doc.analysis_result || {};
      const uploadDate = new Date(doc.upload_time).toLocaleString('zh-TW');
      const errorCount = (result.format_errors?.length || 0) + (result.missing_references?.length || 0);
      const statusClass = errorCount === 0 ? 'success' : errorCount < 5 ? 'warning' : 'danger';
      const statusIcon = errorCount === 0 ? 'check-circle' : 'exclamation-triangle';
      
      return `
        <div class="document-item">
          <div class="row align-items-center">
            <div class="col-md-6">
              <h5 class="mb-1">
                <i class="fas fa-file-word text-primary me-2"></i>${escapeHtml(doc.filename)}
              </h5>
              <small class="text-muted">
                <i class="fas fa-clock me-1"></i>${uploadDate}
              </small>
            </div>
            <div class="col-md-3 text-center">
              <span class="badge bg-${statusClass} fs-6">
                <i class="fas fa-${statusIcon} me-1"></i>
                ${errorCount === 0 ? '完美' : errorCount + ' 個問題'}
              </span>
            </div>
            <div class="col-md-3 text-end">
              <button class="btn btn-sm btn-info me-2" onclick="viewDocument(${doc.id})">
                <i class="fas fa-eye me-1"></i>查看
              </button>
              <button class="btn btn-sm btn-danger" onclick="deleteDocument(${doc.id}, '${escapeHtml(doc.filename)}')">
                <i class="fas fa-trash me-1"></i>刪除
              </button>
            </div>
          </div>
          ${result.total_citations !== undefined ? `
          <div class="row mt-3">
            <div class="col-md-3">
              <small class="text-muted">引用次數：</small>
              <strong>${result.total_citations || 0}</strong>
            </div>
            <div class="col-md-3">
              <small class="text-muted">參考文獻：</small>
              <strong>${result.total_references || 0}</strong>
            </div>
            <div class="col-md-3">
              <small class="text-muted">格式錯誤：</small>
              <strong class="text-warning">${result.format_errors?.length || 0}</strong>
            </div>
            <div class="col-md-3">
              <small class="text-muted">缺少文獻：</small>
              <strong class="text-danger">${result.missing_references?.length || 0}</strong>
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  function displayStats(documents) {
    document.getElementById('statsSection').style.display = 'block';
    document.getElementById('totalDocuments').textContent = documents.length;

    let totalErrors = 0;
    let docsWithResults = 0;

    documents.forEach(doc => {
      if (doc.analysis_result) {
        const errors = (doc.analysis_result.format_errors?.length || 0) + 
                      (doc.analysis_result.missing_references?.length || 0);
        totalErrors += errors;
        docsWithResults++;
      }
    });

    document.getElementById('totalErrors').textContent = totalErrors;
    
    if (docsWithResults > 0) {
      const avgErrors = (totalErrors / docsWithResults).toFixed(1);
      document.getElementById('avgScore').textContent = avgErrors;
    }
  }

  function viewDocument(docId) {
    // 儲存文件 ID 到 sessionStorage，然後返回首頁顯示結果
    fetch(`/api/documents/${docId}`, {
      credentials: 'include'
    })
      .then(response => response.json())
      .then(data => {
        if (data.document && data.document.analysis_result) {
          // 將結果儲存到 sessionStorage
          sessionStorage.setItem('viewingDocument', JSON.stringify(data.document));
          window.location.href = '/?view=' + docId;
        }
      })
      .catch(error => {
        alert('無法載入文件：' + error.message);
      });
  }

  async function deleteDocument(docId, filename) {
    if (!confirm(`確定要刪除文件「${filename}」嗎？此操作無法復原。`)) {
      return;
    }

    try {
      const response = await fetch(`/api/documents/${docId}`, {
        method: 'DELETE',
        credentials: 'include'
      });

      if (!response.ok) {
        throw new Error('刪除失敗');
      }

      // 重新載入列表
      loadDocuments();
      
      // 顯示成功訊息
      alert('文件已刪除');

    } catch (error) {
      alert('刪除文件時發生錯誤：' + error.message);
    }
  }

  async function logout() {
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        credentials: 'include'
      });
    } catch (error) {
      console.error('Logout error:', error);
    }
    
    // 刪除登入 cookie
    document.cookie = 'logged_in=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    
    // 清除本地儲存
    sessionStorage.clear();
    localStorage.removeItem('user');
    
    // 重新導向到首頁
    window.location.replace('/');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 載入主題偏好
  function loadThemePreference() {
    // 優先從 localStorage 取得
    const savedTheme = localStorage.getItem('theme') || 'modern-light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  }

  // 檢查登入狀態
  async function checkAuth() {
    try {
      const response = await fetch('/api/auth/user', {
        credentials: 'include'
      });
      if (!response.ok) {
        // 未登入，重新導向到首頁
        window.location.replace('/');
        return false;
      }
      return true;
    } catch (error) {
      window.location.replace('/');
      return false;
    }
  }

  // 頁面載入時執行
  document.addEventListener('DOMContentLoaded', function() {
    loadThemePreference();
    loadDocuments();
  });

  // 同步檢查 cookie 的函數
  function checkCookie() {
    if (!document.cookie.includes('logged_in=true')) {
      window.location.replace('/');
      return false;
    }
    return true;
  }

  // 處理從瀏覽器快取返回的情況（按返回鍵時）
  window.addEventListener('pageshow', function(event) {
    checkCookie();  // 同步檢查，立即重新導向
  });

  // 阻止用戶按返回鍵離開後再返回
  window.addEventListener('popstate', function(event) {
    checkCookie();
  });

  // 當頁面獲得焦點時檢查（從其他分頁切換回來時）
  window.addEventListener('focus', function() {
    checkCookie();
  });

  // 定期檢查（每秒檢查一次）
  setInterval(checkCookie, 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
