<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 防止瀏覽器快取此頁面 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>個人資料 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============ 主題系統 - CSS 變數 ============ */
    :root, [data-theme="modern-light"] {
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
      --bg-main: #ffffff;
      --bg-gradient: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --card-bg: #f8fafc;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --border-color: #e2e8f0;
      --hover-bg: #f1f5f9;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-text: #1e293b;
      --card-radius: 16px;
    }
    
    [data-theme="cyber-night"] {
      --primary-color: #06ffa5;
      --primary-dark: #00cc84;
      --bg-main: #0a0a0f;
      --bg-gradient: #0a0a0f;
      --text-primary: #e0ffe0;
      --text-secondary: #a0ffa0;
      --text-muted: #4a9a4a;
      --card-bg: rgba(10, 20, 15, 0.9);
      --card-shadow: 0 0 30px rgba(6, 255, 165, 0.15);
      --border-color: #06ffa530;
      --hover-bg: rgba(6, 255, 165, 0.1);
      --input-bg: rgba(10, 20, 15, 0.9);
      --input-border: #06ffa550;
      --input-text: #e0ffe0;
      --card-radius: 4px;
    }
    
    [data-theme="google-colors"] {
      --primary-color: #4285F4;
      --primary-dark: #3367D6;
      --bg-main: #ffffff;
      --bg-gradient: #ffffff;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-muted: #9aa0a6;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px rgba(60, 64, 67, 0.15), 0 4px 8px rgba(60, 64, 67, 0.1);
      --border-color: #e8eaed;
      --hover-bg: #f8f9fa;
      --input-bg: #ffffff;
      --input-border: #dadce0;
      --input-text: #202124;
      --card-radius: 16px;
    }
    
    [data-theme="aurora"] {
      --primary-color: #22d3ee;
      --primary-dark: #06b6d4;
      --bg-main: #0f172a;
      --bg-gradient: #0f172a;
      --text-primary: #f0fdfa;
      --text-secondary: #99f6e4;
      --text-muted: #5eead4;
      --card-bg: rgba(15, 23, 42, 0.8);
      --card-shadow: 0 10px 40px rgba(34, 211, 238, 0.1);
      --border-color: rgba(34, 211, 238, 0.2);
      --hover-bg: rgba(34, 211, 238, 0.1);
      --input-bg: rgba(15, 23, 42, 0.8);
      --input-border: rgba(34, 211, 238, 0.4);
      --input-text: #f0fdfa;
      --card-radius: 20px;
    }
    
    [data-theme="minimal-ink"] {
      --primary-color: #374151;
      --primary-dark: #1f2937;
      --bg-main: #fefefe;
      --bg-gradient: #fefefe;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #9ca3af;
      --card-bg: #ffffff;
      --card-shadow: 4px 4px 0 #111827;
      --border-color: #111827;
      --hover-bg: #f9fafb;
      --input-bg: #ffffff;
      --input-border: #111827;
      --input-text: #111827;
      --card-radius: 0px;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .profile-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 40px;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
    }
    .profile-container h2 {
      color: var(--text-primary);
    }
    .profile-container h2 i {
      color: var(--primary-color);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    .card-header {
      background: var(--hover-bg);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .card-body {
      color: var(--text-secondary);
    }
    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
    }
    .form-control:focus {
      background: var(--input-bg);
      border-color: var(--primary-color);
      color: var(--input-text);
      box-shadow: 0 0 0 3px rgba(90, 103, 216, 0.15);
    }
    .form-label {
      color: var(--text-primary);
    }
    .fw-bold {
      color: var(--text-primary);
    }
    .btn-primary {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }
    .btn-outline-secondary {
      color: var(--text-secondary);
      border-color: var(--border-color);
    }
    .btn-outline-secondary:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
      border-color: var(--border-color);
    }
  </style>
</head>
<body>
<script>
  // 立即檢查登入 cookie，未登入則重新導向
  if (!document.cookie.includes('logged_in=true')) {
    window.location.replace('/');
  }
</script>
  <div class="profile-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fas fa-user-circle text-primary"></i> 個人資料</h2>
      <a href="/" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>返回首頁
      </a>
    </div>
    
    <!-- 載入中 -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">載入中...</span>
      </div>
    </div>
    
    <!-- 錯誤訊息 -->
    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>
    
    <!-- 個人資料內容 -->
    <div id="profileContent" class="d-none">
      <!-- 帳號資訊 -->
      <div class="card mb-4">
        <div class="card-header">
          <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>帳號資訊</h5>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Email：</div>
            <div class="col-md-9" id="userEmail"></div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3 fw-bold">註冊時間：</div>
            <div class="col-md-9" id="createdAt"></div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3 fw-bold">驗證狀態：</div>
            <div class="col-md-9" id="verificationStatus"></div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3 fw-bold">登入方式：</div>
            <div class="col-md-9" id="loginMethod"></div>
          </div>
          <div class="row">
            <div class="col-md-3 fw-bold">會員狀態：</div>
            <div class="col-md-9" id="premiumStatus"></div>
          </div>
        </div>
      </div>
      
      <!-- 兌換邀請碼（非 Premium 用戶才顯示） -->
      <div class="card mb-4" id="redeemCodeCard" style="display: none;">
        <div class="card-header">
          <h5 class="mb-0"><i class="fas fa-gift me-2"></i>兌換邀請碼</h5>
        </div>
        <div class="card-body">
          <p class="text-muted mb-3">輸入邀請碼即可升級為 Premium 會員，解鎖所有主題！</p>
          <form id="redeemCodeForm">
            <div class="input-group">
              <input type="text" class="form-control" id="inviteCode" 
                     placeholder="輸入邀請碼（例如：ABCD1234EFGH）" 
                     style="text-transform: uppercase;" required>
              <button type="submit" class="btn btn-success" id="redeemCodeBtn">
                <span class="spinner-border spinner-border-sm d-none me-2" id="redeemSpinner"></span>
                兌換
              </button>
            </div>
          </form>
        </div>
      </div>
      
      <!-- 編輯使用者名稱 -->
      <div class="card mb-4">
        <div class="card-header">
          <h5 class="mb-0"><i class="fas fa-edit me-2"></i>編輯使用者名稱</h5>
        </div>
        <div class="card-body">
          <form id="updateUsernameForm">
            <div class="mb-3">
              <label for="username" class="form-label">使用者名稱</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <button type="submit" class="btn btn-primary" id="updateUsernameBtn">
              <span class="spinner-border spinner-border-sm d-none me-2" id="updateUsernameSpinner"></span>
              更新名稱
            </button>
          </form>
        </div>
      </div>
      
      <!-- 修改密碼（僅 Email 登入使用者） -->
      <div class="card mb-4" id="changePasswordCard">
        <div class="card-header">
          <h5 class="mb-0"><i class="fas fa-key me-2"></i>修改密碼</h5>
        </div>
        <div class="card-body">
          <form id="changePasswordForm">
            <div class="mb-3">
              <label for="oldPassword" class="form-label">舊密碼</label>
              <input type="password" class="form-control" id="oldPassword" required>
            </div>
            <div class="mb-3">
              <label for="newPassword" class="form-label">新密碼（至少 8 個字元）</label>
              <input type="password" class="form-control" id="newPassword" required minlength="8">
            </div>
            <div class="mb-3">
              <label for="confirmNewPassword" class="form-label">確認新密碼</label>
              <input type="password" class="form-control" id="confirmNewPassword" required minlength="8">
            </div>
            <button type="submit" class="btn btn-warning" id="changePasswordBtn">
              <span class="spinner-border spinner-border-sm d-none me-2" id="changePasswordSpinner"></span>
              修改密碼
            </button>
          </form>
        </div>
      </div>
      
      <!-- 重新發送驗證郵件 -->
      <div class="card mb-4" id="resendVerificationCard" style="display: none;">
        <div class="card-header">
          <h5 class="mb-0"><i class="fas fa-envelope me-2"></i>Email 驗證</h5>
        </div>
        <div class="card-body">
          <p class="text-warning">您的 Email 尚未驗證，請點擊下方按鈕重新發送驗證郵件。</p>
          <button class="btn btn-info" id="resendVerificationBtn">
            <span class="spinner-border spinner-border-sm d-none me-2" id="resendSpinner"></span>
            重新發送驗證郵件
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentUser = null;
    
    // 載入使用者資料
    async function loadUserProfile() {
      try {
        const response = await fetch('/api/auth/user', {
          credentials: 'include'
        });
        
        if (!response.ok) {
          if (response.status === 401) {
            // 使用 replace 防止用戶用返回鍵回來
            window.location.replace('/login');
            return;
          }
          throw new Error('載入失敗');
        }
        
        const data = await response.json();
        currentUser = data.user;
        
        // 顯示使用者資訊
        document.getElementById('userEmail').textContent = currentUser.email;
        document.getElementById('createdAt').textContent = new Date(currentUser.created_at).toLocaleString('zh-TW');
        document.getElementById('username').value = currentUser.username;
        
        // 驗證狀態
        const verificationStatus = document.getElementById('verificationStatus');
        if (currentUser.is_verified) {
          verificationStatus.innerHTML = '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>已驗證</span>';
        } else {
          verificationStatus.innerHTML = '<span class="badge bg-warning"><i class="fas fa-exclamation-triangle me-1"></i>未驗證</span>';
          document.getElementById('resendVerificationCard').style.display = 'block';
        }
        
        // 登入方式
        const loginMethod = document.getElementById('loginMethod');
        if (currentUser.has_google_login) {
          loginMethod.innerHTML = '<span class="badge bg-primary"><i class="fab fa-google me-1"></i>Google</span>';
          // 隱藏修改密碼卡片（Google 使用者沒有密碼）
          document.getElementById('changePasswordCard').style.display = 'none';
        } else {
          loginMethod.innerHTML = '<span class="badge bg-secondary"><i class="fas fa-envelope me-1"></i>Email</span>';
        }
        
        // 會員狀態
        const premiumStatus = document.getElementById('premiumStatus');
        if (currentUser.is_premium) {
          premiumStatus.innerHTML = '<span class="badge bg-warning text-dark"><i class="fas fa-crown me-1"></i>Premium 會員</span>';
        } else {
          premiumStatus.innerHTML = '<span class="badge bg-secondary"><i class="fas fa-user me-1"></i>免費會員</span>';
          // 顯示兌換邀請碼卡片
          document.getElementById('redeemCodeCard').style.display = 'block';
        }
        
        // 顯示內容
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('profileContent').classList.remove('d-none');
        
      } catch (error) {
        document.getElementById('loading').classList.add('d-none');
        showError('載入失敗：' + error.message);
      }
    }
    
    // 更新使用者名稱
    document.getElementById('updateUsernameForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const btn = document.getElementById('updateUsernameBtn');
      const spinner = document.getElementById('updateUsernameSpinner');
      
      btn.disabled = true;
      spinner.classList.remove('d-none');
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showSuccess(data.message);
          currentUser.username = username;
        } else {
          showError(data.error || '更新失敗');
        }
      } catch (error) {
        showError('系統錯誤');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
    
    // 修改密碼
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      
      if (newPassword !== confirmNewPassword) {
        showError('新密碼與確認密碼不一致');
        return;
      }
      
      const btn = document.getElementById('changePasswordBtn');
      const spinner = document.getElementById('changePasswordSpinner');
      
      btn.disabled = true;
      spinner.classList.remove('d-none');
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_password: oldPassword, new_password: newPassword }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showSuccess(data.message);
          document.getElementById('changePasswordForm').reset();
        } else {
          showError(data.error || '修改失敗');
        }
      } catch (error) {
        showError('系統錯誤');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
    
    // 兌換邀請碼
    document.getElementById('redeemCodeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const code = document.getElementById('inviteCode').value.trim().toUpperCase();
      const btn = document.getElementById('redeemCodeBtn');
      const spinner = document.getElementById('redeemSpinner');
      
      if (!code) {
        showError('請輸入邀請碼');
        return;
      }
      
      btn.disabled = true;
      spinner.classList.remove('d-none');
      hideMessages();
      
      try {
        const response = await fetch('/api/redeem-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showSuccess(data.message);
          // 更新顯示
          currentUser.is_premium = true;
          document.getElementById('premiumStatus').innerHTML = '<span class="badge bg-warning text-dark"><i class="fas fa-crown me-1"></i>Premium 會員</span>';
          document.getElementById('redeemCodeCard').style.display = 'none';
          // 更新 localStorage
          localStorage.setItem('user', JSON.stringify(data.user));
        } else {
          showError(data.error || '兌換失敗');
        }
      } catch (error) {
        showError('系統錯誤');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
    
    // 重新發送驗證郵件
    document.getElementById('resendVerificationBtn').addEventListener('click', async () => {
      const btn = document.getElementById('resendVerificationBtn');
      const spinner = document.getElementById('resendSpinner');
      
      btn.disabled = true;
      spinner.classList.remove('d-none');
      hideMessages();
      
      try {
        const response = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showSuccess(data.message);
        } else {
          showError(data.error || '發送失敗');
        }
      } catch (error) {
        showError('系統錯誤');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
    
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.remove('d-none');
      window.scrollTo(0, 0);
    }
    
    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.classList.remove('d-none');
      window.scrollTo(0, 0);
    }
    
    function hideMessages() {
      document.getElementById('errorMessage').classList.add('d-none');
      document.getElementById('successMessage').classList.add('d-none');
    }
    
    // 載入主題偏好
    function loadThemePreference() {
      // 優先從 localStorage 取得
      const savedTheme = localStorage.getItem('theme') || 'modern-light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // 檢查登入狀態
    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/user', {
          credentials: 'include'
        });
        if (!response.ok) {
          // 未登入，重新導向到首頁
          window.location.replace('/');
          return false;
        }
        return true;
      } catch (error) {
        window.location.replace('/');
        return false;
      }
    }

    // 頁面載入時執行
    loadThemePreference();
    loadUserProfile();

    // 同步檢查 cookie 的函數
    function checkCookie() {
      if (!document.cookie.includes('logged_in=true')) {
        window.location.replace('/');
        return false;
      }
      return true;
    }

    // 處理從瀏覽器快取返回的情況（按返回鍵時）
    window.addEventListener('pageshow', function(event) {
      checkCookie();  // 同步檢查，立即重新導向
    });

    // 阻止用戶按返回鍵離開後再返回
    window.addEventListener('popstate', function(event) {
      checkCookie();
    });

    // 當頁面獲得焦點時檢查（從其他分頁切換回來時）
    window.addEventListener('focus', function() {
      checkCookie();
    });

    // 定期檢查（每秒檢查一次）
    setInterval(checkCookie, 1000);
  </script>
</body>
</html>
