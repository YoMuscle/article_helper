<!DOCTYPE html>
<html lang="zh-Hant" data-theme="modern-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>管理後台 - 論文救火站</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-dark: #4f46e5;
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    
    body {
      font-family: "Noto Sans TC", sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }
    
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .admin-header h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    
    .admin-header h1 i {
      color: var(--primary-color);
    }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .card-header {
      background: rgba(99, 102, 241, 0.1);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      font-weight: 600;
    }
    
    .card-body {
      padding: 20px;
    }
    
    .btn-primary {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    
    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }
    
    .table {
      color: var(--text-primary);
    }
    
    .table thead th {
      border-bottom-color: var(--border-color);
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .table td {
      border-bottom-color: var(--border-color);
      vertical-align: middle;
    }
    
    .badge-used {
      background: var(--danger);
    }
    
    .badge-valid {
      background: var(--success);
    }
    
    .badge-premium {
      background: var(--warning);
      color: #000;
    }
    
    .badge-free {
      background: var(--text-secondary);
    }
    
    .code-display {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      background: rgba(99, 102, 241, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    
    .form-control, .form-select {
      background: var(--bg-main);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    
    .form-control:focus, .form-select:focus {
      background: var(--bg-main);
      border-color: var(--primary-color);
      color: var(--text-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-card .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-color);
    }
    
    .stat-card .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    
    .copy-btn {
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    
    .copy-btn:hover {
      opacity: 1;
    }
    
    .nav-tabs {
      border-bottom-color: var(--border-color);
    }
    
    .nav-tabs .nav-link {
      color: var(--text-secondary);
      border: none;
      padding: 10px 20px;
    }
    
    .nav-tabs .nav-link:hover {
      color: var(--text-primary);
      border: none;
    }
    
    .nav-tabs .nav-link.active {
      background: var(--bg-card);
      color: var(--primary-color);
      border: 1px solid var(--border-color);
      border-bottom: none;
    }
    
    .no-access {
      text-align: center;
      padding: 100px 20px;
    }
    
    .no-access i {
      font-size: 4rem;
      color: var(--danger);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<script>
  if (!document.cookie.includes('logged_in=true')) {
    window.location.replace('/');
  }
</script>

<div class="admin-container">
  <!-- 載入中 -->
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">載入中...</span>
    </div>
    <p class="mt-3 text-secondary">驗證管理員權限...</p>
  </div>
  
  <!-- 無權限 -->
  <div id="noAccess" class="no-access d-none">
    <i class="fas fa-ban"></i>
    <h2>無權限存取</h2>
    <p class="text-secondary">您不是管理員，無法存取此頁面。</p>
    <a href="/" class="btn btn-primary mt-3">
      <i class="fas fa-home me-2"></i>返回首頁
    </a>
  </div>
  
  <!-- 管理內容 -->
  <div id="adminContent" class="d-none">
    <div class="admin-header">
      <h1><i class="fas fa-shield-alt me-2"></i>管理後台</h1>
      <a href="/" class="btn btn-outline-light">
        <i class="fas fa-arrow-left me-1"></i>返回首頁
      </a>
    </div>
    
    <!-- 統計卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">-</div>
        <div class="stat-label">總用戶數</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="premiumUsers">-</div>
        <div class="stat-label">Premium 用戶</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalCodes">-</div>
        <div class="stat-label">邀請碼總數</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="unusedCodes">-</div>
        <div class="stat-label">未使用邀請碼</div>
      </div>
    </div>
    
    <!-- 分頁標籤 -->
    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#inviteCodes">
          <i class="fas fa-ticket-alt me-2"></i>邀請碼管理
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#users">
          <i class="fas fa-users me-2"></i>用戶管理
        </button>
      </li>
    </ul>
    
    <div class="tab-content">
      <!-- 邀請碼管理 -->
      <div class="tab-pane fade show active" id="inviteCodes">
        <div class="card">
          <div class="card-header">
            <i class="fas fa-plus-circle me-2"></i>產生邀請碼
          </div>
          <div class="card-body">
            <div class="row align-items-end">
              <div class="col-md-4 mb-3 mb-md-0">
                <label class="form-label">產生數量</label>
                <select class="form-select" id="codeCount">
                  <option value="1">1 個</option>
                  <option value="3">3 個</option>
                  <option value="5" selected>5 個</option>
                  <option value="10">10 個</option>
                </select>
              </div>
              <div class="col-md-4">
                <button class="btn btn-primary w-100" id="generateBtn">
                  <i class="fas fa-magic me-2"></i>產生邀請碼
                </button>
              </div>
            </div>
            
            <!-- 新產生的邀請碼 -->
            <div id="newCodes" class="mt-4 d-none">
              <h6 class="text-success"><i class="fas fa-check-circle me-2"></i>新產生的邀請碼：</h6>
              <div id="newCodesList" class="mt-2"></div>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-list me-2"></i>所有邀請碼</span>
            <button class="btn btn-sm btn-outline-light" onclick="loadInviteCodes()">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>邀請碼</th>
                    <th>狀態</th>
                    <th>使用者</th>
                    <th>建立時間</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="codesTable">
                  <tr><td colspan="5" class="text-center py-4">載入中...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 用戶管理 -->
      <div class="tab-pane fade" id="users">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-users me-2"></i>所有用戶</span>
            <button class="btn btn-sm btn-outline-light" onclick="loadUsers()">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>Email</th>
                    <th>使用者名稱</th>
                    <th>狀態</th>
                    <th>註冊時間</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="usersTable">
                  <tr><td colspan="5" class="text-center py-4">載入中...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentUser = null;
  
  // 檢查管理員權限
  async function checkAdminAccess() {
    try {
      const response = await fetch('/api/admin/users', { credentials: 'include' });
      
      if (response.status === 403 || response.status === 401) {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('noAccess').classList.remove('d-none');
        return false;
      }
      
      if (response.ok) {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('adminContent').classList.remove('d-none');
        loadStats();
        loadInviteCodes();
        loadUsers();
        return true;
      }
    } catch (error) {
      document.getElementById('loading').classList.add('d-none');
      document.getElementById('noAccess').classList.remove('d-none');
    }
    return false;
  }
  
  // 載入統計
  async function loadStats() {
    try {
      const [usersRes, codesRes] = await Promise.all([
        fetch('/api/admin/users', { credentials: 'include' }),
        fetch('/api/admin/invite-codes', { credentials: 'include' })
      ]);
      
      const usersData = await usersRes.json();
      const codesData = await codesRes.json();
      
      document.getElementById('totalUsers').textContent = usersData.total || 0;
      document.getElementById('premiumUsers').textContent = 
        usersData.users.filter(u => u.is_premium).length || 0;
      document.getElementById('totalCodes').textContent = codesData.total || 0;
      document.getElementById('unusedCodes').textContent = codesData.unused || 0;
    } catch (error) {
      console.error('載入統計失敗:', error);
    }
  }
  
  // 載入邀請碼
  async function loadInviteCodes() {
    try {
      const response = await fetch('/api/admin/invite-codes', { credentials: 'include' });
      const data = await response.json();
      
      const tbody = document.getElementById('codesTable');
      
      if (!data.codes || data.codes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-secondary">還沒有邀請碼</td></tr>';
        return;
      }
      
      tbody.innerHTML = data.codes.map(code => `
        <tr>
          <td>
            <span class="code-display">${code.code}</span>
            <i class="fas fa-copy ms-2 copy-btn" onclick="copyCode('${code.code}')" title="複製"></i>
          </td>
          <td>
            ${code.is_used 
              ? '<span class="badge badge-used">已使用</span>' 
              : '<span class="badge badge-valid">可使用</span>'}
          </td>
          <td>${code.used_by || '-'}</td>
          <td>${new Date(code.created_at).toLocaleString('zh-TW')}</td>
          <td>
            ${!code.is_used 
              ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteCode('${code.code}')">
                  <i class="fas fa-trash"></i>
                </button>` 
              : ''}
          </td>
        </tr>
      `).join('');
    } catch (error) {
      console.error('載入邀請碼失敗:', error);
    }
  }
  
  // 載入用戶
  async function loadUsers() {
    try {
      const response = await fetch('/api/admin/users', { credentials: 'include' });
      const data = await response.json();
      
      const tbody = document.getElementById('usersTable');
      
      if (!data.users || data.users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-secondary">還沒有用戶</td></tr>';
        return;
      }
      
      tbody.innerHTML = data.users.map(user => `
        <tr>
          <td>${user.email}</td>
          <td>${user.username}</td>
          <td>
            ${user.is_premium 
              ? '<span class="badge badge-premium"><i class="fas fa-crown me-1"></i>Premium</span>' 
              : '<span class="badge badge-free">免費</span>'}
            ${user.is_verified 
              ? '<span class="badge bg-success ms-1">已驗證</span>' 
              : '<span class="badge bg-secondary ms-1">未驗證</span>'}
          </td>
          <td>${new Date(user.created_at).toLocaleString('zh-TW')}</td>
          <td>
            ${user.is_premium 
              ? `<button class="btn btn-sm btn-outline-warning" onclick="togglePremium('${user.email}', false)">
                  <i class="fas fa-arrow-down"></i> 降級
                </button>`
              : `<button class="btn btn-sm btn-outline-success" onclick="togglePremium('${user.email}', true)">
                  <i class="fas fa-arrow-up"></i> 升級
                </button>`}
          </td>
        </tr>
      `).join('');
    } catch (error) {
      console.error('載入用戶失敗:', error);
    }
  }
  
  // 產生邀請碼
  document.getElementById('generateBtn').addEventListener('click', async () => {
    const count = parseInt(document.getElementById('codeCount').value);
    const btn = document.getElementById('generateBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>產生中...';
    
    try {
      const response = await fetch('/api/admin/invite-codes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count }),
        credentials: 'include'
      });
      
      const data = await response.json();
      
      if (response.ok) {
        // 顯示新產生的邀請碼
        const newCodesDiv = document.getElementById('newCodes');
        const newCodesList = document.getElementById('newCodesList');
        
        newCodesList.innerHTML = data.codes.map(c => `
          <div class="d-flex align-items-center mb-2">
            <span class="code-display me-3">${c.code}</span>
            <button class="btn btn-sm btn-outline-light" onclick="copyCode('${c.code}')">
              <i class="fas fa-copy"></i> 複製
            </button>
          </div>
        `).join('');
        
        newCodesDiv.classList.remove('d-none');
        
        // 重新載入列表和統計
        loadInviteCodes();
        loadStats();
      } else {
        alert(data.error || '產生失敗');
      }
    } catch (error) {
      alert('系統錯誤');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-magic me-2"></i>產生邀請碼';
    }
  });
  
  // 複製邀請碼
  function copyCode(code) {
    navigator.clipboard.writeText(code).then(() => {
      // 簡單的提示
      const btn = event.target;
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i>';
      setTimeout(() => btn.innerHTML = originalHTML, 1000);
    });
  }
  
  // 刪除邀請碼
  async function deleteCode(code) {
    if (!confirm(`確定要刪除邀請碼 ${code} 嗎？`)) return;
    
    try {
      const response = await fetch(`/api/admin/invite-codes/${code}`, {
        method: 'DELETE',
        credentials: 'include'
      });
      
      if (response.ok) {
        loadInviteCodes();
        loadStats();
      } else {
        const data = await response.json();
        alert(data.error || '刪除失敗');
      }
    } catch (error) {
      alert('系統錯誤');
    }
  }
  
  // 切換 Premium 狀態
  async function togglePremium(email, upgrade) {
    const action = upgrade ? '升級' : '降級';
    if (!confirm(`確定要${action} ${email} 嗎？`)) return;
    
    try {
      const endpoint = upgrade ? '/api/admin/upgrade-user' : '/api/admin/downgrade-user';
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
        credentials: 'include'
      });
      
      const data = await response.json();
      
      if (response.ok) {
        loadUsers();
        loadStats();
      } else {
        alert(data.error || `${action}失敗`);
      }
    } catch (error) {
      alert('系統錯誤');
    }
  }
  
  // 初始化
  checkAdminAccess();
</script>
</body>
</html>
